<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latte Art | Maria Constanza Lepe</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Latte Art</h1>
        <p>Maria Constanza Lepe</p>
    </header>

    <section class="gallery">

        <img src="images/latte1.JPG" alt="Latte art 1">
        <img src="images/latte2.JPG" alt="Latte art 2">
        <img src="images/latte3.JPG" alt="Latte art 3">
        <img src="images/latte4.JPG" alt="Latte art 4">
        <img src="images/latte5.JPG" alt="Latte art 5">
        <img src="images/latte6.JPG" alt="Latte art 6">
        <img src="images/latte7.JPG" alt="Latte art 7">

    </section>


    <!-- Visor de imágenes -->

    <div id="lightbox" class="lightbox">

        <span class="close">&times;</span>

        <img id="lightbox-img" src="" alt="">

    </div>


    <script>

        const images = document.querySelectorAll(".gallery img");

        const lightbox = document.getElementById("lightbox");

        const lightboxImg = document.getElementById("lightbox-img");

        const close = document.querySelector(".close");


        images.forEach(image => {

            image.addEventListener("click", () => {

                lightbox.classList.add("active");

                lightboxImg.src = image.src;

            });

        });


        close.addEventListener("click", () => {

            lightbox.classList.remove("active");

        });


        lightbox.addEventListener("click", (e) => {

            if (e.target === lightbox) {

                lightbox.classList.remove("active");

            }

        });

    </script>

</body>

</html>
