    <!-- VISOR DE IMÁGENES -->

    <div id="lightbox" class="lightbox">


        <span class="close">&times;</span>


        <div class="lightbox-content">


            <div class="image-wrapper">

                <img id="lightbox-img" src="" alt="">

                <div class="signature">ASTROCONY</div>

            </div>


            <div class="lightbox-info">

                <div id="lightbox-title"></div>

                <div id="lightbox-location"></div>

                <div id="lightbox-date"></div>

            </div>


            <button class="lightbox-arrow prev" id="prev-photo" aria-label="Previous photo">
                &#10094;
            </button>
            
            <button class="lightbox-arrow next" id="next-photo" aria-label="Next photo">
                &#10095;
            </button>


        </div>


    </div>



    <!-- JAVASCRIPT -->

    <script>


        const images = document.querySelectorAll(".gallery img");

        const lightbox = document.getElementById("lightbox");

        const lightboxImg = document.getElementById("lightbox-img");

        const lightboxTitle = document.getElementById("lightbox-title");

        const lightboxLocation = document.getElementById("lightbox-location");

        const lightboxDate = document.getElementById("lightbox-date");

        const close = document.querySelector(".close");



        /* ABRIR FOTO */

        images.forEach(image => {


            image.addEventListener("click", () => {


                lightbox.classList.add("active");


                lightboxImg.src = image.src;

                lightboxImg.alt = image.alt;


                /* INFORMACIÓN */

                lightboxTitle.textContent = image.dataset.title || "";

                lightboxLocation.textContent = image.dataset.location || "";

                lightboxDate.textContent = image.dataset.date || "";


            });


        });



        /* CERRAR CON X */

        close.addEventListener("click", () => {

            lightbox.classList.remove("active");

        });



        /* CERRAR HACIENDO CLICK FUERA */

        lightbox.addEventListener("click", (e) => {


            if (e.target === lightbox) {

                lightbox.classList.remove("active");

            }


        });



        /* CREAR INFORMACIÓN PARA HOVER */

        images.forEach(image => {


            if (!image.dataset.title) return;


            const wrapper = document.createElement("div");

            wrapper.classList.add("gallery-item");


            image.parentNode.insertBefore(wrapper, image);

            wrapper.appendChild(image);



            const info = document.createElement("div");

            info.classList.add("photo-hover-info");


            info.innerHTML = `

                <div class="photo-hover-title">
                    ${image.dataset.title}
                </div>

                <div class="photo-hover-location">
                    ${image.dataset.location || ""}
                </div>

            `;


            wrapper.appendChild(info);


        });


        /* NAVEGACIÓN ENTRE FOTOS */

let currentIndex = 0;

const prevButton = document.getElementById("prev-photo");
const nextButton = document.getElementById("next-photo");

function showPhoto(index) {
    currentIndex = (index + images.length) % images.length;

    const image = images[currentIndex];

    lightboxImg.src = image.src;
    lightboxImg.alt = image.alt;

    lightboxTitle.textContent = image.dataset.title || "";
    lightboxLocation.textContent = image.dataset.location || "";
    lightboxDate.textContent = image.dataset.date || "";
}

images.forEach((image, index) => {
    image.addEventListener("click", () => {
        currentIndex = index;
        showPhoto(currentIndex);
    });
});

prevButton.addEventListener("click", (event) => {
    event.stopPropagation();
    showPhoto(currentIndex - 1);
});

nextButton.addEventListener("click", (event) => {
    event.stopPropagation();
    showPhoto(currentIndex + 1);
});

    /* FLECHAS DEL TECLADO */

    document.addEventListener("keydown", (event) => {
        if (!lightbox.classList.contains("active")) return;

        if (event.key === "ArrowRight") {
            showPhoto(currentIndex + 1);
        }

        if (event.key === "ArrowLeft") {
            showPhoto(currentIndex - 1);
        }

        if (event.key === "Escape") {
            lightbox.classList.remove("active");
        }
    });


    </script>
