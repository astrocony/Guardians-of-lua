    <!-- MAIN INTRO -->

        <video class="hero-video" autoplay muted loop playsinline>

            <nav class="portfolios">

                <a href="https://astrocony.com/paintings/" class="portfolio">
                    <div class="circle">

                    </div>
                    <h2>Painting</h2>
                </a>

                <a href="https://www.astrocony.com/photography/" class="portfolio">

                    </div>

                <a href="https://astrocony.com/illustrations/" class="portfolio">

                        <div class="hover-info"><span>Explore ↗</span></div>
                    </div>

                <a href="https://www.webtoons.com/es/canvas/en-la-oscuridad-de-plutón/list?title_no=676710" class="portfolio">

                        <div class="hover-info"><span>Read ↗</span></div>
                    </div>
                    <h2>Webtoon</h2>
                </a>

                <a href="https://www.astrocony.com/introgame" class="portfolio">
                    <div class="circle">
                        <img src="images/lua-game.JPG" alt="Lua Game">
                        <div class="hover-info"><span>Play ↗</span></div>
                    </div>
                    <h2>Lua Game</h2>

        <div class="social-links">
            <a href="https://www.instagram.com/astrocony/"

               target="_blank" rel="noopener noreferrer">

            </a>
